version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - task-queue-network

  coordinator:
    build:
      context: .
      dockerfile: Coordinator/Dockerfile
    ports:
      - "5280:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Option B: Use MySQL from Laragon running on the HOST machine
      # Ensure Laragon MySQL is running and listening on 3306.
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Port=3306;Database=DistributedTaskQueue;User=root;Password=;
      - Redis__ConnectionString=redis:6379
    depends_on:
      - redis
    networks:
      - task-queue-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - coordinator
    networks:
      - task-queue-network

  worker-node-1:
    build:
      context: .
      dockerfile: WorkerNode/Dockerfile
    environment:
      - Worker__WorkerId=worker-1
      - Worker__HostAddress=worker-node-1
      - Worker__Port=8080
      - Coordinator__BaseUrl=http://coordinator:8080
      - Redis__ConnectionString=redis:6379
    depends_on:
      - coordinator
      - redis
    networks:
      - task-queue-network

  worker-node-2:
    build:
      context: .
      dockerfile: WorkerNode/Dockerfile
    environment:
      - Worker__WorkerId=worker-2
      - Worker__HostAddress=worker-node-2
      - Worker__Port=8080
      - Coordinator__BaseUrl=http://coordinator:8080
      - Redis__ConnectionString=redis:6379
    depends_on:
      - coordinator
      - redis
    networks:
      - task-queue-network

volumes:
  redis-data:

networks:
  task-queue-network:
    driver: bridge

